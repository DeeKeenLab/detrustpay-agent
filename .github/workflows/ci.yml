name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public repository hygiene
        run: ./scripts/check-public-repo.sh
      - name: Validate committed JSON
        run: make json-check

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  program-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
      - name: Run Anchor program host tests
        run: cargo test --locked --manifest-path program/programs/trustpay/Cargo.toml
